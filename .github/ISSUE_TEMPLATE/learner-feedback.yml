name: Learner feedback
description: Tell us where a tutorial was clear, confusing, too dense, or incomplete.
title: "[Learner]: "
labels:
  - learner-feedback
body:
  - type: dropdown
    id: tutorial
    attributes:
      label: Tutorial
      options:
        - Agentic AI in Research
        - Building a Website for Your Research Using AI
        - Developing Custom Annotation Tools Using AI
        - Run an AI in Healthcare Conference
    validations:
      required: true
  - type: dropdown
    id: background
    attributes:
      label: Your starting point
      options:
        - New to research software
        - Researcher with basic coding experience
        - Experienced research software user
        - Educator or supervisor
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Where did you slow down or lose confidence?
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: What was most useful?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal, patient, confidential, and unpublished research details.
          required: true
