<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Synthetic peg-transfer training frame</title>
  <desc id="description">An original vector scene with a training board, coloured rings, pegs, and two simplified instruments. It contains no patient or clinical image.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1822"/>
      <stop offset="1" stop-color="#162b35"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aabdc2"/>
      <stop offset="1" stop-color="#687e84"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b9d3dc" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#background)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <ellipse cx="400" cy="552" rx="315" ry="32" fill="#061018" opacity=".45"/>

  <g filter="url(#shadow)" transform="translate(145 174)">
    <path d="M32 68L468 8l45 300L78 367z" fill="url(#board)" stroke="#d3e0e2" stroke-width="4"/>
    <path d="M68 92L444 40l31 237L101 328z" fill="#7f969c" stroke="#536c73" stroke-width="3"/>
    <path d="M109 117L422 74l22 176L132 293z" fill="#253c43" opacity=".62"/>

    <g fill="#d9e4e5" stroke="#4c6268" stroke-width="4">
      <path d="M150 113v72"/>
      <ellipse cx="150" cy="113" rx="16" ry="9"/>
      <path d="M249 99v72"/>
      <ellipse cx="249" cy="99" rx="16" ry="9"/>
      <path d="M348 85v72"/>
      <ellipse cx="348" cy="85" rx="16" ry="9"/>
      <path d="M170 227v72"/>
      <ellipse cx="170" cy="227" rx="16" ry="9"/>
      <path d="M269 213v72"/>
      <ellipse cx="269" cy="213" rx="16" ry="9"/>
      <path d="M368 199v72"/>
      <ellipse cx="368" cy="199" rx="16" ry="9"/>
    </g>

    <g fill="none" stroke-width="14">
      <ellipse cx="150" cy="129" rx="33" ry="22" stroke="#ed746c"/>
      <ellipse cx="269" cy="229" rx="33" ry="22" stroke="#f2c75b"/>
      <ellipse cx="348" cy="101" rx="33" ry="22" stroke="#69cfa1"/>
      <ellipse cx="368" cy="215" rx="33" ry="22" stroke="#6fa9ec"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <path d="M40 48L342 340" fill="none" stroke="#d9e3e6" stroke-width="20" stroke-linecap="round"/>
    <path d="M40 48L342 340" fill="none" stroke="#52666c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="342" cy="340" r="18" fill="#a8bbc0" stroke="#edf5f6" stroke-width="3"/>
    <path d="M346 346l25 34M334 350l7 41" fill="none" stroke="#dce7e9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M760 32L558 354" fill="none" stroke="#d9e3e6" stroke-width="20" stroke-linecap="round"/>
    <path d="M760 32L558 354" fill="none" stroke="#52666c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="558" cy="354" r="18" fill="#a8bbc0" stroke="#edf5f6" stroke-width="3"/>
    <path d="M553 361l-27 31M566 363l-8 39" fill="none" stroke="#dce7e9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g transform="translate(24 520)">
    <rect width="416" height="48" fill="#071018" fill-opacity=".88" stroke="#6e8790"/>
    <circle cx="22" cy="24" r="6" fill="#69cfa1"/>
    <text x="40" y="21" fill="#f0f5f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">SYNTHETIC TRAINING FRAME</text>
    <text x="40" y="38" fill="#9eb2b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">ORIGINAL VECTOR · NO PATIENT OR CLINICAL DATA</text>
  </g>
</svg>
